# Render Blueprint: WhatsApp voice secretary
# Deploy from the repository root (backend folder) to get a stable HTTPS URL.
services:
  - type: web
    name: whatsapp-secretary
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      - key: PORT
        value: 8000
      - key: WHAPI_TOKEN
        sync: false      # set in Render dashboard (secret)
      - key: OPENAI_API_KEY
        sync: false      # set in Render dashboard (secret)
      - key: LANGUAGE
        value: ar
      - key: TONE
        value: friendly
      - key: VOICE_REPLIES
        value: "on"
      - key: GEMINI_API_KEY
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM_NUMBER
        sync: false
      - key: OWNER_WHATSAPP_NUMBER
        sync: false
      - key: PUBLIC_BASE_URL
        value: https://whatsapp-secretary-mrmm.onrender.com
